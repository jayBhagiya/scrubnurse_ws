# Parameters of the Scrubnurse nodes on the real cell.
# Simulation overrides live in sim.yaml (loaded after this file).

kinect_camera:
  ros__parameters:
    # Overhead Azure Kinect of the cell (ROS 1: media_streamer/kinect_camera.launch).
    serial: ""
    color_resolution: RES_1080P
    color_format: COLOR_MJPG
    depth_mode: WFOV_2X2BINNED
    fps: FPS_30
    synchronized_images_only: true
    publish_depth: true
    frame_id: rgb_camera_link

tool_detector:
  ros__parameters:
    device: cuda:0
    image_size: 1088  # the size the model was trained at
    confidence_threshold: 0.5
    # Model class index -> tool id, and the tools whose heading needs flipping.
    class_ids: [A, B, C, D, E, F]
    flip_orientation_ids: [E, F]
    # Table work area in the 1920x1080 overhead image (x, y pairs).
    use_roi: true
    roi_polygon: [875, 750, 1384, 750, 1384, 298, 875, 298]
    # Tools are ~140 px long here, ~190 px in the training images: enlarge the ROI to match.
    roi_scale: 1.35
    rate: 15.0
    publish_annotated: true
    display: false

tool_localizer:
  ros__parameters:
    # Cell coordinates (poses.yaml, homography) are in the UR `base` frame, not base_link.
    frame_id: base
    # Pixel -> base homography calibrated on 2026-10-29 with tool D, 12 pairs, mean error 6 mm
    # (pairs in scrubnurse_perception/test/data/calibration_pairs_2026-10-29.csv).
    # Recompute with: ros2 run scrubnurse_perception compute_homography pairs.csv
    homography: [2.107374008703312e-05, -0.0009835987872172961, 0.5204127672229939, -0.0010712933526266216, -6.0781671571262156e-05, 0.1568357679535437, 7.906395267137633e-05, 3.927996498273985e-05, 1.0]

voice_command:
  ros__parameters:
    model: medium.en
    device: cuda
    record_seconds: 5.0
    tool_ids: [A, B, C, D, E, F]
    tool_names: [pointed scissors, needle holder, mosquito, scalpel, anatomical forceps, surgical forceps]
    similarity_threshold: 0.75

scrubnurse_controller:
  ros__parameters:
    tool_ids: [A, B, C, D, E, F]
    group_name: ur_manipulator
    base_frame: base
    end_effector_link: tool0
    # Full speed here: the pendant's speed slider sets the real arm speed (10% slider = 10%).
    velocity_scaling: 1.0
    acceleration_scaling: 1.0
    min_cartesian_fraction: 0.95
    # An arm motion running this much longer than planned is cancelled (seconds).
    motion_timeout: 10.0
    start_paused: true
    step_mode: true
    home_pose: ""
    detection_timeout: 1.0
    settle_time: 0.5
    # Table area the camera watches; tools put down here are returned to the magazine.
    return_area: [-0.18, -1.20, 0.22, -0.75]
    approach_height: 0.38
    grasp_height:
      x_range: [-0.18, 0.22]
      y_range: [-0.75, -1.2]
      z_at_y0: [0.24615, 0.24691]
      z_at_y1: [0.24810, 0.24900]
    gripper:
      backend: robotiq_socket
      port: 63352
